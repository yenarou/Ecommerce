<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#8b3a3a" />
  <title>Sin conexión · Hilo y Alma</title>
  <style>
    :root {
      --paper: #efe6d6;
      --paper-soft: #f6f1e7;
      --ink: #2b241e;
      --ink-soft: #6a5f52;
      --thread: #8b3a3a;
      --thread-dark: #6e2c2c;
      --mustard: #c98a2c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--paper);
      color: var(--ink);
      font-family: Georgia, 'Times New Roman', serif;
    }
    main {
      max-width: 420px;
      text-align: center;
      background: var(--paper-soft);
      border: 2px solid var(--ink);
      border-radius: 12px;
      padding: 32px 24px;
      box-shadow: 6px 6px 0 var(--mustard);
    }
    img { width: 96px; height: 96px; border-radius: 24px; }
    h1 { margin: 16px 0 8px; font-size: 1.6rem; }
    p {
      margin: 0 0 24px;
      color: var(--ink-soft);
      line-height: 1.5;
      font-family: system-ui, sans-serif;
    }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    button, a {
      font: 600 1rem system-ui, sans-serif;
      padding: 10px 18px;
      border: 2px solid var(--ink);
      border-radius: 999px;
      cursor: pointer;
      text-decoration: none;
    }
    button { background: var(--thread); color: var(--paper-soft); }
    button:hover { background: var(--thread-dark); }
    a { background: transparent; color: var(--ink); }
    :focus-visible { outline: 3px solid var(--mustard); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" />
    <h1>Sin conexión</h1>
    <p>
      No pudimos cargar esta página y todavía no la tenemos guardada.
      Revisa tu conexión a internet e inténtalo de nuevo.
      Las páginas que ya visitaste siguen disponibles.
    </p>
    <div class="actions">
      <button type="button" onclick="location.reload()">Reintentar</button>
      <a href="/">Ir al inicio</a>
    </div>
  </main>
</body>
</html>
