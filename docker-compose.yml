services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ApiBaseUrl: http://localhost:14001
      AdminUser__Name: Administrador
      AdminUser__Email: admin23@gmail.com
      AdminUser__Password: ${ADMIN_PASSWORD}
      ASPNETCORE_URLS: http://+:8080
      Logging__LogLevel__Default: Debug
      Logging__LogLevel__Microsoft.AspNetCore: Debug
      Logging__LogLevel__Microsoft.EntityFrameworkCore: Debug
      Logging__LogLevel__MongoDB.Driver: Debug
      ConnectionStrings__PostgreSQL: Host=postgres;Port=5432;Database=ECommerce;Username=postgres;Password=${POSTGRES_PASSWORD:-cisco}
      ConnectionStrings__MongoDB: mongodb://mongo:27017
      Google__ClientId: ${GOOGLE_CLIENT_ID}
      Google__ClientSecret: ${GOOGLE_CLIENT_SECRET}
      Google__WebRedirectUri: http://localhost:14001/api/v1/auth/google/callback
      Google__ApiRedirectUri: http://localhost:15174/api/auth/callback
    ports:
      - "${BACKEND_PORT:-14001}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend-astro
      dockerfile: Dockerfile
      args:
        PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:14001/graphql}
    environment:
      API_INTERNAL_URL: http://backend:8080/graphql
    ports:
      - "${FRONTEND_PORT:-15174}:80"
    depends_on:
      - backend
    restart: unless-stopped

  frontend-admin:
    build:
      context: ./FrontendAdmin
      dockerfile: Dockerfile
      args:
        PUBLIC_GRAPHQL_URL: http://localhost:14001/graphql
        PUBLIC_API_URL: http://localhost:14001
        PUBLIC_AUTH_URL: http://localhost:14001
    ports:
      - "15175:15175"
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ECommerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cisco}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ECommerce"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mongo:
    image: mongo:8.0
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  mongo-data: